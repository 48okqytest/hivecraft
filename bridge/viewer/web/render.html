<!doctype html>
<html><head><meta charset="utf-8"><title>hivecraft headless renderer</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "./three/three.module.js" } }</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { buildScene } from './scene.js';
import { drawTeamMap } from './map.js';

THREE.ColorManagement.enabled = false;
const glCanvas = document.createElement('canvas');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
let atlas = null;
async function getAtlas() {
  if (atlas) return atlas;
  const t = await new THREE.TextureLoader().loadAsync('./atlas.png?' + Date.now());
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  t.colorSpace = THREE.NoColorSpace;
  atlas = t; return t;
}
function disposeScene(scene) {
  scene.traverse((o) => { o.geometry?.dispose?.(); if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose()); } });
}
window.hcReady = true;
window.hcRender = async (payload) => {
  const t0 = performance.now();
  const W = payload.width || 1024, H = payload.height || 640;
  const tex = await getAtlas();
  renderer.setSize(W, H, false);
  const built = buildScene(THREE, payload, tex);
  renderer.render(built.scene, built.camera);
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const ctx = out.getContext('2d');
  ctx.drawImage(glCanvas, 0, 0);
  built.drawOverlay(ctx, W, H);
  const url = out.toDataURL('image/png');
  disposeScene(built.scene);
  return { png: url.slice(url.indexOf(',') + 1), faces: built.faces, view: built.viewDesc, ms: Math.round(performance.now() - t0) };
};
window.hcMap = async (payload) => {
  const out = document.createElement('canvas');
  const r = drawTeamMap(out, payload);
  const url = out.toDataURL('image/png');
  return { png: url.slice(url.indexOf(',') + 1), ...r };
};
</script>
</body></html>
